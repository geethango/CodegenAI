<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wireframe Preview</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h1 { margin-bottom: 20px; }
nav { margin-bottom: 20px; }
button { margin: 5px; padding: 5px 10px; cursor: pointer; }
.page { display: none; border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; }
.page.active { display: block; }
input, select, textarea { margin-bottom: 10px; display: block; padding: 5px; }
</style>
</head>
<body>
<h1>Wireframe Preview</h1>
<div id="moduleNav"></div>
<div id="pagesContainer"></div>

<script>
let wireframe = {};

// Load latest project wireframe automatically
async function loadLatestProject() {
  const res = await fetch('/api/get-latest-project');
  const data = await res.json();
  if(data.success && data.project.wireframe){
    wireframe = data.project.wireframe;
    renderModules();
  } else {
    document.body.innerHTML += "<p>No wireframe found in latest project.</p>";
  }
}

// Render modules as buttons
function renderModules(){
  const navDiv = document.getElementById('moduleNav');
  navDiv.innerHTML = '';
  const pagesDiv = document.getElementById('pagesContainer');
  pagesDiv.innerHTML = '';

  if(!wireframe.pages) return;

  Object.keys(wireframe.pages).forEach(module=>{
    const btn = document.createElement('button');
    btn.textContent = module;
    btn.onclick = ()=>renderPages(module);
    navDiv.appendChild(btn);
  });

  // Auto-click first module
  const firstModule = Object.keys(wireframe.pages)[0];
  if(firstModule) renderPages(firstModule);
}

// Render pages of selected module
function renderPages(module){
  const pagesDiv = document.getElementById('pagesContainer');
  pagesDiv.innerHTML = '';
  const modulePages = wireframe.pages[module];

  Object.keys(modulePages).forEach(page=>{
    const div = document.createElement('div');
    div.className = 'page active';
    const pageData = modulePages[page];

    div.innerHTML = `<h2>${pageData.title}</h2><p>${pageData.description || ''}</p>`;
    
    pageData.components.forEach(c=>{
      if(c.type === 'input'){
        div.innerHTML += `<label>${c.label}: <input type="${c.inputType || 'text'}" name="${c.name}"/></label>`;
      } else if(c.type === 'button'){
        div.innerHTML += `<button>${c.label}</button>`;
      }
    });

    pagesDiv.appendChild(div);
  });
}

loadLatestProject();
</script>
</body>
</html>
